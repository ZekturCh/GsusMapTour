<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ruta Topitop Lima</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  display: flex;
  height: 100vh;
  overflow: hidden;
}

#sidebar {
  width: 280px;
  background: #111;
  color: white;
  padding: 15px;
  overflow-y: auto;
}

#sidebar h2 {
  text-align: center;
}

.location-item {
  padding: 10px;
  border-bottom: 1px solid #333;
  cursor: pointer;
}

.location-item:hover {
  background: #222;
}

.orden {
  background: #4CAF50;
  padding: 3px 7px;
  border-radius: 50%;
  margin-right: 8px;
}

#map {
  flex: 1;
}
</style>
</head>

<body>

<div id="sidebar">
  <h2>Ruta Topitop</h2>
  <div id="lista"></div>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>
const map = L.map('map').setView([-12.0464, -77.0428], 12);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '© OpenStreetMap'
}).addTo(map);

const lista = document.getElementById("lista");

// Cargar JSON externo
fetch("tiendas.json")
  .then(response => response.json())
  .then(data => {

    const tiendas = data.tiendas.sort((a, b) => a.orden - b.orden);

    tiendas.forEach(tienda => {

      const marker = L.marker([tienda.latitud, tienda.longitud]).addTo(map)
        .bindPopup(`
          <b>#${tienda.orden} - ${tienda.nombre}</b><br>
          Cantidad: ${tienda.cantidad}<br><br>
          <a href="${tienda.link}" target="_blank">
          Abrir en Google Maps</a>
        `);

      const item = document.createElement("div");
      item.className = "location-item";
      item.innerHTML = `
        <span class="orden">${tienda.orden}</span>
        ${tienda.nombre}
      `;

      item.onclick = () => {
        map.setView([tienda.latitud, tienda.longitud], 16);
        marker.openPopup();
      };

      lista.appendChild(item);
    });

  });

</script>

</body>
</html>
