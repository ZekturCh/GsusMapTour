<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Boda 28 Feb 📸</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Menú lateral -->
  <!-- Menú lateral -->
<div id="sideMenu">
  <div id="closeMenu">✕</div>

  <button onclick="showCamera()">📸 Tomar Foto</button>
  <button onclick="showGallery()">🖼 Ver Álbum</button>
</div>

<!-- Botón menú -->
<div id="menuButton">☰</div>

  <!-- Cámara -->
  <div id="cameraSection">
    <video id="video" autoplay playsinline></video>
    <button id="captureBtn">Tomar Foto</button>
    <button id="switchCameraBtn">🔄 Cambiar Cámara</button>
    <button id="uploadFileBtn">Subir Foto</button>
    <div id="uploadLoader" style="display:none;">Subiendo fotos...</div>
    <input type="file" id="fileInput" accept="image/*" multiple style="display:none;">
    <canvas id="canvas" style="display:none;"></canvas>
  </div>

  <!-- Galería -->
  <div id="gallerySection" style="display:none;">
    <h2>Álbum del Evento</h2>
    <div id="gallery"></div>
  </div>
  <img id="weddingBanner" src="boda28.webp" style="display:none;">
  <script src="app.js"></script>
</body>
</html>
